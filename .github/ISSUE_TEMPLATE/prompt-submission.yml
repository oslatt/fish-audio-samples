name: Submit a voice prompt
description: Add a voice prompt to the library. Drag your audio file into the form body.
title: "Prompt: "
labels: ["prompt-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit a prompt

        Thanks for contributing to the Fish Audio Prompt Library.

        1. Attach your audio file (mp3/wav/ogg/m4a/flac) using the **Audio file** field below. You can also drag it anywhere into the form body.
        2. Fill in every required field below.
        3. Submit. An automated pipeline will review it, upload your audio to the CDN, and open a pull request with your entry.

  - type: upload
    id: audio
    attributes:
      label: Audio file
      description: Drag your audio file (mp3/wav/ogg/m4a/flac) here.
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Prompt title
      description: Short, searchable name for this prompt, e.g. "Robotic Evil".
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Model
      description: FishSpeech model used to generate/infer this prompt.
      options:
        - S2.1 Pro
        - S1.1
        - S1
        - Other (mention in notes)
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      description: ISO 639-1 code, e.g. `en`, `zh`, `ja`.
      placeholder: en
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated keywords, e.g. `robotic, evil, deep`.
      placeholder: robotic, evil
    validations:
      required: true

  - type: textarea
    id: prompt_text
    attributes:
      label: Prompt text
      description: The exact voice prompt (the text that is spoken to produce the voice reference).
    validations:
      required: true

  - type: input
    id: top_p
    attributes:
      label: Top P (optional)
      description: Sampling parameter used. Leave empty to use the default `0.95`.
      placeholder: "0.95"

  - type: input
    id: temperature
    attributes:
      label: Temperature (optional)
      description: Sampling parameter used. Leave empty to use the default `0.8`.
      placeholder: "0.8"

  - type: dropdown
    id: nsfw
    attributes:
      label: NSFW (optional)
      description: Mark this prompt as 18+ content.
      options:
        - "No"
        - "Yes"

  - type: textarea
    id: description
    attributes:
      label: Notes / description (optional)
      description: Anything else to show on the prompt page.

  - type: input
    id: contributor
    attributes:
      label: Your name or handle
      description: Shown on the prompt page as the contributor.
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: License / consent
      description: Required.
      options:
        - label: "I confirm this audio is generated by me, I have the rights to share it, and I license it for publication on this site under a permissive license."
          required: true
    validations:
      required: true